preset_save:
  fields:
    device_id:
      selector:
        device:
          integration: a74_bridge
          multiple: true
    preset:
      example: client-abc
      selector:
        text:
    note:
      selector:
        text:
preset_list: {}
preset_delete:
  fields:
    preset:
      required: true
      selector:
        text:
sync_from:
  fields:
    device_id:
      selector:
        device:
          integration: a74_bridge
          multiple: true
    source:
      required: true
      default: a74-bridge-1
      selector:
        text:
    mode:
      default: parameters
      selector:
        select:
          options: ["parameters", "full"]
preset_load:
  fields:
    device_id:
      selector:
        device:
          integration: a74_bridge
          multiple: true
    preset:
      required: true
      selector:
        text:
clock_sync:
  fields:
    device_id:
      selector:
        device:
          integration: a74_bridge
          multiple: true
    force:
      selector:
        boolean:
set_properties:
  fields:
    device_id:
      selector:
        device:
          integration: a74_bridge
          multiple: true
    properties:
      required: true
      selector:
        object:
record:
  fields:
    device_id:
      selector:
        device:
          integration: a74_bridge
          multiple: true
    action:
      required: true
      selector:
        select:
          options: ["start", "stop"]
    jam:
      default: true
      selector:
        boolean:
    fps:
      default: 25
      selector:
        select:
          options: ["24", "25", "30", "50", "60"]
timecode_jam:
  fields:
    device_id:
      selector:
        device:
          integration: a74_bridge
          multiple: true
    fps:
      default: 25
      selector:
        select:
          options: ["24", "25", "30", "50", "60"]
focus_refresh:
  fields:
    device_id:
      selector:
        device:
          integration: a74_bridge
          multiple: true
media_list:
  fields:
    device_id:
      selector:
        device:
          integration: a74_bridge
          multiple: true
media_upload:
  fields:
    device_id:
      selector:
        device:
          integration: a74_bridge
          multiple: false
    prefix:
      required: true
      example: test/rezerwacja-ab12cd
      selector:
        text:
    files:
      required: true
      example: '["C0002.MP4", {"name": "C0003.MP4", "dest": "cam1_C0003.MP4"}]'
      selector:
        object:
media_job:
  fields:
    device_id:
      selector:
        device:
          integration: a74_bridge
          multiple: true
media_cancel:
  fields:
    device_id:
      selector:
        device:
          integration: a74_bridge
          multiple: true
console_media_list: {}
console_media_upload:
  fields:
    prefix:
      required: true
      example: test/rezerwacja-ab12cd
      selector:
        text:
    files:
      required: true
      example: '[{"path": "4K CAPTURE_2026-11-08_4_18-43-02/Video/1_CAMERA 1.mp4", "dest": "iso_cam1.mp4"}]'
      selector:
        object:
console_media_job: {}
console_media_cancel: {}
