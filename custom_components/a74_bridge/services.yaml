    device_id:
      selector:
        device:
          integration: a74_bridge
          multiple: true
    preset:
      required: true
      example: client-abc
      selector:
        text:
preset_load:
  fields:
    device_id:
      selector:
        device:
          integration: a74_bridge
          multiple: true
    preset:
      required: true
      selector:
        text:
clock_sync:
  fields:
    device_id:
      selector:
        device:
          integration: a74_bridge
          multiple: true
    force:
      selector:
        boolean:
set_properties:
  fields:
    device_id:
      selector:
        device:
          integration: a74_bridge
          multiple: true
    properties:
      required: true
      selector:
        object:
record:
  fields:
    device_id:
      selector:
        device:
          integration: a74_bridge
          multiple: true
    action:
      required: true
      selector:
        select:
