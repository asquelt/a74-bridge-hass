# Creates a GitHub Release for every v* tag that arrives through the Gitea push mirror,
# so HACS sees proper versions instead of commit hashes.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MAN=$(python3 -c "import json;print(json.load(open('custom_components/a74_bridge/manifest.json'))['version'])")
          test "$TAG" = "$MAN" || { echo "tag $TAG != manifest $MAN"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
